name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hookline, POSTGRES_PASSWORD: hookline, POSTGRES_DB: hookline }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hookline" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://hookline:hookline@localhost:5432/hookline
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build
      # A short torture run on every push to main: fails the build if anything is lost.
      - if: github.ref == 'refs/heads/main'
        run: pnpm torture --messages 300 --workers 2 --kill-every 4
