# Local stack: infrastructure only by default; add `--profile app` to also run Hookline itself.
#   docker compose -f deploy/docker-compose.yml up -d                   # postgres, redis, observability
#   docker compose -f deploy/docker-compose.yml --profile app up -d     # + api, worker ×2, chaos receiver
name: hookline

x-hookline-env: &hookline-env
  DATABASE_URL: postgres://hookline:hookline@postgres:5432/hookline
  REDIS_URL: redis://redis:6379
  ALLOW_INSECURE_ENDPOINTS: "true"
  ENDPOINT_ALLOWLIST: "172.16.0.0/12" # lets endpoints reach the chaos receiver on the compose network
  DEV_LOGIN: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: hookline, POSTGRES_PASSWORD: hookline, POSTGRES_DB: hookline }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "hookline"], interval: 2s, retries: 30 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: [./otel-collector.yaml:/etc/otel/config.yaml:ro]
    ports: ["4318:4318"]

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: [./tempo.yaml:/etc/tempo.yaml:ro]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:11.2.0
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Admin }
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  api:
    profiles: [app]
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["pnpm", "--filter", "@hookline/api", "start"]
    environment: { <<: *hookline-env }
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy } }

  worker:
    profiles: [app]
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["pnpm", "--filter", "@hookline/worker", "start"]
    environment: { <<: *hookline-env }
    deploy: { replicas: 2 }
    depends_on: { postgres: { condition: service_healthy } }

  chaos-receiver:
    profiles: [app]
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["pnpm", "--filter", "@hookline/chaos-receiver", "start"]
    ports: ["9000:9000"]

volumes:
  pgdata:
